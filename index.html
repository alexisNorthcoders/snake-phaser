<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake MP</title>
  <meta name="description" content="Multiplayer snake in your browser. Eat, grow, cut off rivals. No sign-up." />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <meta property="og:title" content="Snake MP" />
  <meta property="og:description" content="Multiplayer snake in your browser. Eat, grow, cut off rivals. No sign-up." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://snakemp.duckdns.org/" />
  <meta property="og:image" content="https://snakemp.duckdns.org/share-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Snake MP" />
  <meta name="twitter:description" content="Multiplayer snake in your browser. Eat, grow, cut off rivals. No sign-up." />
  <meta name="twitter:image" content="https://snakemp.duckdns.org/share-card.png" />
</head>

<body>
  <style>
    html,
    body {
      overscroll-behavior: none;
    }

    body {
      background-color: %THEME_BACKGROUND%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
    }

    /* Phaser FITs the square board inside this box. In portrait the box is only as tall as
       it is wide, so the board sits at the top and the address bar showing/hiding can't move it. */
    #game-container {
      background-color: %THEME_BACKGROUND%;
      width: 100%;
      height: min(100dvh, 100vw);
      touch-action: none;
    }

    #game-container canvas {
      display: block;
    }

    @media (orientation: portrait) {
      body {
        align-items: flex-start;
      }
    }
  </style>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
