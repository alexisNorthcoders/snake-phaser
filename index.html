<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phaser Game</title>
</head>

<body>
  <style>
    html,
    body {
      overscroll-behavior: none;
    }

    body {
      background-color: %THEME_BACKGROUND%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
    }

    /* Phaser FITs the square board inside this box. In portrait the box is only as tall as
       it is wide, so the board sits at the top and the address bar showing/hiding can't move it. */
    #game-container {
      background-color: %THEME_BACKGROUND%;
      width: 100%;
      height: min(100dvh, 100vw);
      touch-action: none;
    }

    #game-container canvas {
      display: block;
    }

    @media (orientation: portrait) {
      body {
        align-items: flex-start;
      }
    }
  </style>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
